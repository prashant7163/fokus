name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: analyze · test · assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Must resolve pubspec.lock as committed: the lockfile is created on the
      # dev machine (Dart 3.12); an older CI Dart would silently re-resolve to
      # different package versions and generate different drift code.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Dependencies
        run: flutter pub get

      # drift's NativeDatabase in `flutter test` loads the host libsqlite3
      - name: Install libsqlite3 (host tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Generate code (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK (assembleDebug)
        run: flutter build apk --debug

      # Wrapper scripts are injected by the flutter tool during the APK build.
      - name: Native unit tests (Kotlin blocking core)
        run: cd android && ./gradlew testDebugUnitTest --no-daemon
