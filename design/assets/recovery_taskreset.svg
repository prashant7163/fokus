<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Task reset recovery illustration">
  <title>Task reset — one small next step</title>
  <desc>A path of stepping dots leading to a single highlighted checkbox, suggesting the next smallest step. Sage calm-wash line art (no blue), both-theme safe.</desc>
  <defs>
    <linearGradient id="calmGradT" x1="40" y1="180" x2="200" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FA07E"/>
      <stop offset="1" stop-color="#B7C3A5"/>
    </linearGradient>
  </defs>
  <path d="M48 180 C90 176 116 150 132 118"
        stroke="url(#calmGradT)" stroke-width="2.5" stroke-linecap="round" fill="none"
        stroke-dasharray="1 12" stroke-opacity="0.6"/>
  <g fill="none" stroke="url(#calmGradT)" stroke-width="2.5">
    <circle cx="52" cy="180" r="7" stroke-opacity="0.4"/>
    <circle cx="86" cy="166" r="7" stroke-opacity="0.55"/>
    <circle cx="112" cy="142" r="7" stroke-opacity="0.7"/>
  </g>
  <rect x="124" y="72" width="72" height="72" rx="18"
        stroke="url(#calmGradT)" stroke-width="3" fill="#8FA07E" fill-opacity="0.14"/>
  <path d="M142 108 l12 12 24 -26"
        stroke="url(#calmGradT)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <g stroke="#8FA07E" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85">
    <path d="M160 56 v-9"/>
    <path d="M182 62 l6 -6"/>
    <path d="M138 62 l-6 -6"/>
  </g>
</svg>
