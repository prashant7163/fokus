<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="First Session achievement badge">
  <title>First Session badge</title>
  <desc>Achievement badge: the FOKUS broken focus ring with a filled center dot, marking the first completed session. Warm-gold celebration frame, orange glyph.</desc>
  <defs>
    <linearGradient id="frameA" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2C24E"/><stop offset="1" stop-color="#C88418"/>
    </linearGradient>
    <linearGradient id="glyphA" x1="36" y1="36" x2="84" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7A30"/><stop offset="1" stop-color="#E8611F"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="50" stroke="url(#frameA)" stroke-width="4" fill="#F2C24E" fill-opacity="0.08"/>
  <path d="M63.8 38.6 A22 22 0 1 1 56.2 38.6" stroke="url(#glyphA)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <circle cx="60" cy="60" r="6" fill="url(#glyphA)"/>
</svg>
