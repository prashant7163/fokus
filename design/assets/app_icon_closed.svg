<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FOKUS app icon (closed ring variant)">
  <title>FOKUS app icon — closed ring (v2 variant)</title>
  <desc>Closed-circle variant of the FOKUS mark: a full orange ring with a solid center dot on a charcoal field. Use for monochrome/notification layers and sub-24px favicons where the gap could misread as a glitch.</desc>
  <defs>
    <linearGradient id="emberGradC" x1="120" y1="90" x2="392" y2="422" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7A30"/>
      <stop offset="1" stop-color="#E8611F"/>
    </linearGradient>
    <linearGradient id="charcoalBgC" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F2C27"/>
      <stop offset="1" stop-color="#221F1B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#charcoalBgC)"/>
  <circle cx="256" cy="256" r="150" stroke="url(#emberGradC)" stroke-width="34" fill="none"/>
  <circle cx="256" cy="256" r="30" fill="url(#emberGradC)"/>
</svg>
