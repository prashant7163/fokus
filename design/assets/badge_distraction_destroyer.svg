<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Distraction Destroyer achievement badge">
  <title>Distraction Destroyer badge</title>
  <desc>Achievement badge: a calm shield with a soft check, for 100 blocks redirected. Non-violent, redirect-not-punish metaphor. Amber frame, indigo glyph.</desc>
  <defs>
    <linearGradient id="badgeRingE" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB86B"/><stop offset="1" stop-color="#FF9E4B"/>
    </linearGradient>
    <linearGradient id="focusE" x1="40" y1="40" x2="80" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B6CFF"/><stop offset="1" stop-color="#7A6BFF"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="50" stroke="url(#badgeRingE)" stroke-width="4" fill="#FFB86B" fill-opacity="0.08"/>
  <!-- soft shield -->
  <path d="M60 36 l18 7 v14 c0 15 -9 24 -18 29 c-9 -5 -18 -14 -18 -29 v-14 z"
        stroke="url(#focusE)" stroke-width="3.5" fill="#5B6CFF" fill-opacity="0.12" stroke-linejoin="round"/>
  <!-- gentle check inside (redirect, not destroy) -->
  <path d="M52 60 l6 6 12 -14" stroke="url(#focusE)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
