<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shrink session recovery illustration">
  <title>Shrink session — finish small</title>
  <desc>A large ring gently narrowing to a smaller, warm-completing ring, suggesting reducing the remaining time to finish on a win. Sage/calm with an amber landing accent, both-theme safe.</desc>
  <defs>
    <linearGradient id="calmGradSh" x1="40" y1="40" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FD3C4"/>
      <stop offset="1" stop-color="#A9C7F0"/>
    </linearGradient>
    <linearGradient id="amberLand" x1="150" y1="120" x2="210" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB86B"/>
      <stop offset="1" stop-color="#FF9E4B"/>
    </linearGradient>
  </defs>

  <!-- Large 'full time' ring, faded -->
  <circle cx="94" cy="120" r="64" stroke="url(#calmGradSh)" stroke-width="3" fill="none" stroke-opacity="0.5"/>
  <!-- broken gap at top of the large ring (brand motif): mask with a small bg-colored cap via a short arc overlay is complex; instead draw as arc -->

  <!-- gentle contracting arrows pointing inward-right (shrinking) -->
  <g stroke="url(#calmGradSh)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M150 96 l14 8 -8 14"/>
    <path d="M150 96 c8 8 12 16 12 28"/>
  </g>

  <!-- Small 'finish small' ring, warm amber = the landing/win -->
  <circle cx="176" cy="132" r="34" stroke="url(#amberLand)" stroke-width="4" fill="#FFB86B" fill-opacity="0.14"/>
  <!-- '10' label rendered as a soft check-into-win: a small check -->
  <path d="M164 132 l8 9 16 -19" stroke="url(#amberLand)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- calm ground shadow -->
  <path d="M78 196 h96" stroke="url(#calmGradSh)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.3"/>
</svg>
