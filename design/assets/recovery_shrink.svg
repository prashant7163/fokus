<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shrink session recovery illustration">
  <title>Shrink session — finish small</title>
  <desc>A large sage ring gently narrowing to a smaller, warm orange completing ring, suggesting reducing the remaining time to finish on a win. Sage calm-wash with a rationed orange landing accent, both-theme safe.</desc>
  <defs>
    <linearGradient id="calmGradSh" x1="40" y1="40" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FA07E"/>
      <stop offset="1" stop-color="#B7C3A5"/>
    </linearGradient>
    <linearGradient id="emberLand" x1="150" y1="120" x2="210" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7A30"/>
      <stop offset="1" stop-color="#E8611F"/>
    </linearGradient>
  </defs>
  <circle cx="94" cy="120" r="64" stroke="url(#calmGradSh)" stroke-width="3" fill="none" stroke-opacity="0.5"/>
  <g stroke="url(#calmGradSh)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M150 96 l14 8 -8 14"/>
    <path d="M150 96 c8 8 12 16 12 28"/>
  </g>
  <!-- Small 'finish small' ring, warm orange = the landing/win (rationed accent) -->
  <circle cx="176" cy="132" r="34" stroke="url(#emberLand)" stroke-width="4" fill="#FF7A30" fill-opacity="0.12"/>
  <path d="M164 132 l8 9 16 -19" stroke="url(#emberLand)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M78 196 h96" stroke="url(#calmGradSh)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.3"/>
</svg>
