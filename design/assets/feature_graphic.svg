<svg width="1024" height="500" viewBox="0 0 1024 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FOKUS Play Store feature graphic">
  <title>FOKUS feature graphic (1024x500, v2)</title>
  <desc>Play Store feature graphic: FOKUS wordmark and tagline on a warm charcoal field, with the broken orange focus ring mark and a soft warm glow. Text kept clear of the right edge where Play overlays the install button.</desc>
  <defs>
    <linearGradient id="fgBg" x1="0" y1="0" x2="1024" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A2723"/>
      <stop offset="1" stop-color="#1C1B19"/>
    </linearGradient>
    <linearGradient id="fgEmber" x1="660" y1="120" x2="924" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7A30"/>
      <stop offset="1" stop-color="#E8611F"/>
    </linearGradient>
    <radialGradient id="fgGlow" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF7A30" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FF7A30" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#fgBg)"/>
  <rect width="1024" height="500" fill="url(#fgGlow)"/>
  <!-- Big broken focus ring on the right (kept ~120px clear of right edge for install button) -->
  <g transform="translate(792 250)">
    <path d="M18.28 -138.8 A140 140 0 1 1 -18.28 -138.8"
          stroke="url(#fgEmber)" stroke-width="26" stroke-linecap="round" fill="none"/>
    <circle cx="0" cy="0" r="26" fill="url(#fgEmber)"/>
  </g>
  <!-- Wordmark + tagline, left-aligned, safe from overlays -->
  <text x="90" y="238" font-family="'Plus Jakarta Sans', sans-serif" font-size="108" font-weight="700" letter-spacing="6.5" fill="#F3EFE9">FOKUS</text>
  <text x="94" y="300" font-family="'Plus Jakarta Sans', sans-serif" font-size="30" font-weight="600" letter-spacing="0.3" fill="#FFB68C">Focus without the fight.</text>
  <text x="94" y="342" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="400" fill="#CFC8BF">Meets you the moment you're tempted — and walks you back.</text>
</svg>
