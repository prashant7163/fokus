name: fokus
description: "FOKUS — AI-assisted focus companion. Blocks distracting apps, guides recovery, builds streaks."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^15.0.0
  intl: any
  cupertino_icons: ^1.0.8
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  uuid: ^4.5.1
  # F-07 recovery illustrations (design/assets/recovery_*.svg). Adding this
  # dependency is PRE-APPROVED by the orchestrator (noted for DECISIONS log).
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the real app on the emulator for the M2 device pass (D-012/D-016):
  # arms a session through the real channel stack since the start-config UI
  # lands with F-11. SDK-bundled, dev-only.
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/recovery/
