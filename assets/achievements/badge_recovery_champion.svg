<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Recovery Champion achievement badge">
  <title>Recovery Champion badge</title>
  <desc>Achievement badge: the calm breathing rings, for 10 recovery resumes. Warm-gold frame with sage glyph ties recovery to celebration.</desc>
  <defs>
    <linearGradient id="frameC" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2C24E"/><stop offset="1" stop-color="#C88418"/>
    </linearGradient>
    <linearGradient id="sageC" x1="36" y1="36" x2="84" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FA07E"/><stop offset="1" stop-color="#B7C3A5"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="50" stroke="url(#frameC)" stroke-width="4" fill="#F2C24E" fill-opacity="0.08"/>
  <circle cx="60" cy="60" r="24" stroke="url(#sageC)" stroke-width="3.5" fill="none" stroke-opacity="0.5"/>
  <circle cx="60" cy="60" r="15" stroke="url(#sageC)" stroke-width="3.5" fill="#8FA07E" fill-opacity="0.18"/>
  <circle cx="60" cy="60" r="5" fill="url(#sageC)"/>
</svg>
