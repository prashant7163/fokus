<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Distraction Destroyer achievement badge">
  <title>Distraction Destroyer badge</title>
  <desc>Achievement badge: a calm shield with a soft check, for 100 blocks redirected. Non-violent, redirect-not-punish metaphor. Warm-gold frame, orange glyph.</desc>
  <defs>
    <linearGradient id="frameE" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2C24E"/><stop offset="1" stop-color="#C88418"/>
    </linearGradient>
    <linearGradient id="glyphE" x1="40" y1="40" x2="80" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7A30"/><stop offset="1" stop-color="#E8611F"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="50" stroke="url(#frameE)" stroke-width="4" fill="#F2C24E" fill-opacity="0.08"/>
  <path d="M60 36 l18 7 v14 c0 15 -9 24 -18 29 c-9 -5 -18 -14 -18 -29 v-14 z"
        stroke="url(#glyphE)" stroke-width="3.5" fill="#E8611F" fill-opacity="0.10" stroke-linejoin="round"/>
  <path d="M52 60 l6 6 12 -14" stroke="url(#glyphE)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
