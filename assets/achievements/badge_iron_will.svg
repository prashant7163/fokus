  <defs>
    <linearGradient id="frameF" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2C24E"/><stop offset="1" stop-color="#C88418"/>
    </linearGradient>
    <linearGradient id="glyphF" x1="44" y1="42" x2="76" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7A30"/><stop offset="1" stop-color="#E8611F"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="50" stroke="url(#frameF)" stroke-width="4" fill="#F2C24E" fill-opacity="0.08"/>
  <path d="M62.6 42.4 A18.5 18.5 0 1 1 57.4 42.4" stroke="url(#frameF)" stroke-width="3" stroke-linecap="round" fill="none" stroke-opacity="0.55"/>
